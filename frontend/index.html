<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse media | Media Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/catalog.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <p class="site-name">Media Tracker</p>
      <!-- add signed-in user controls if needed. -->
      <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">Browse media</a>
      <a href="media-form.html">Add media</a>
      <a href="users.html">Users</a>
      <a href="manage.html">Manage records</a>
      <a href="reports.html">Reports</a>
      </nav>
    </div>
  </header>
  <main id="main" class="container">
    <h1>Browse media</h1>
    <p class="notice">Search movies, shows, and books from the database.</p>
    <section aria-labelledby="search-heading">
      <h2 id="search-heading">Search the catalog</h2>
      <form id="catalog-form">
        <fieldset>
          <legend>Search filters</legend>
          <label for="search">Title</label>
          <input id="search" name="title" maxlength="200" type="search" placeholder="Search by title">
          <label for="media-type">Media type</label>
          <select id="media-type" name="mediaType">
            <option value="">All types</option><option>Movie</option><option>Show</option><option>Book</option>
          </select>
          <label for="genre">Genre</label>
          <select id="genre" name="genreId"><option value="">All genres</option></select>
          <button type="submit">Search</button>
        </fieldset>
      </form>
    </section>
    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Media catalog</h2>
      <div id="catalog-results" class="results" aria-live="polite">Loading catalog…</div>
      <p>Select a title to view details and reviews.</p>
    </section>
  </main>
  <footer class="container"><p>Media Tracker · CIS 560 Group 3</p></footer>
</body>
</html>
